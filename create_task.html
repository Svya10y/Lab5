{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Добавить задание</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
    <link rel="stylesheet" href="{% static 'css/form.css' %}">
</head>
<body>
    <div class="content">
        <h1>Добавить задание</h1>
        <p class="errors">{{ form.errors }}</p>
        <form method="POST">{% csrf_token %}
            <div class="field">
                <label>Название задания</label>
                <input type="text" name="title" placeholder="Название задания" value="{{ form.title }}">
            </div>
            <div class="field">
                <label>Клиент</label>
                <input type="text" name="client" placeholder="Клиент" value="{{ form.client }}">
            </div>
            <div class="field">
                <label>Контактное лицо</label>
                <input type="text" name="contact" placeholder="Контактное лицо" value="{{ form.contact }}">
            </div>
            <div class="field">
                <label>Отдел</label>
                <input type="text" name="department" placeholder="Отдел" value="{{ form.department }}">
            </div>
            <div class="field">
                <label>Сотрудник</label>
                <input type="text" name="employee" placeholder="Сотрудник" value="{{ form.employee }}">
            </div>
            <div class="field">
                <label>Дата выдачи</label>
                <input type="date" name="issue_date" value="{{ form.issue_date }}">
            </div>
            <div class="field">
                <label>Трудоемкость, ч</label>
                <input type="number" name="hours" placeholder="Трудоемкость, ч" value="{{ form.hours }}">
            </div>
            <div class="field">
                <label>Стоимость часа, руб.</label>
                <input type="number" step="0.01" name="hour_rate" placeholder="Стоимость часа, руб." value="{{ form.hour_rate }}">
            </div>
            <div class="field">
                <label>Скидка, %</label>
                <input type="number" step="0.01" name="discount" placeholder="Скидка, %" value="{{ form.discount }}">
            </div>
            <div class="field wide">
                <label>Описание задания</label>
                <textarea name="text" placeholder="Описание задания">{{ form.text }}</textarea>
            </div>
            <div class="field wide">
                <input type="submit" value="Сохранить">
            </div>
        </form>
    </div>
</body>
</html>
